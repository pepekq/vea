name: Build C++ EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: Expand-Archive -Path "*.zip" -DestinationPath ./src

      - name: Compile C++
        shell: cmd
        run: |
          cd src
          for /r %%f in (*.cpp) do call set "FILES=%%FILES%% "%%f""
          g++ %FILES% -o ..\program.exe -static

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: program.exe
