name: Build C++ EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: Expand-Archive -Path "*.zip" -DestinationPath ./src

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Project
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path ./src -Recurse -Filter "*.sln" | Select-Object -First 1
          $cmake = Get-ChildItem -Path ./src -Recurse -Filter "CMakeLists.txt" | Select-Object -First 1
          if ($sln) {
            msbuild $sln.FullName /p:Configuration=Release
          } elseif ($cmake) {
            cmake -S $cmake.DirectoryName -B build
            cmake --build build --config Release
          } else {
            Write-Error "Не найден файл .sln или CMakeLists.txt"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: |
            src/**/*.exe
            build/**/*.exe
